name: 发布 macOS 版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '只读核验已发布版本（不打包、不上传、不修改附件）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 核验标签与已有附件（不覆盖）
        id: release-plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-assets-test.cjs
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/release-assets.cjs --mode verify --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          else
            node scripts/release-assets.cjs --mode prepare --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --sha "$GITHUB_SHA"
          fi

      - name: 安装依赖并检查源码
        if: steps.release-plan.outputs.needs-build == 'true'
        run: |
          npm ci
          npm run typecheck
          npm run build
          node scripts/core-guard.cjs
          node scripts/render-test.cjs
          node scripts/writing-test.cjs
          node scripts/editing-test.cjs
          node scripts/smartquotes-test.cjs
          node scripts/clipboard-format-test.cjs
          node scripts/clipboard-ui-test.cjs
          node scripts/writing-range-integrity-test.cjs
          node scripts/file-commands-test.cjs
          node scripts/autosave-path-test.cjs
          node scripts/autosave-recovery-test.cjs
          node scripts/project-save-test.cjs
          node scripts/project-save-ipc-test.cjs
          node scripts/writing-derivation-test.cjs
          node scripts/native-draft-history-test.cjs
          node scripts/source-integrity-test.cjs
          node scripts/smarttype-test.cjs
          node scripts/smarttype-ui-test.cjs
          node scripts/search-test.cjs
          node scripts/search-ui-test.cjs
          node scripts/zhsp-compat-test.cjs
          node scripts/history-test.cjs
          node scripts/input-performance-test.cjs
          node scripts/pagination-safety-test.cjs
          node scripts/pdf-transport-test.cjs
          node scripts/studio-theme-test.cjs
          node scripts/appearance-test.cjs
          node scripts/outline-reorder-test.cjs
          node scripts/scene-notes-test.cjs
          node scripts/storyboard-drop-test.cjs
          node scripts/storyboard-acts-test.cjs
          node scripts/reports-test.cjs
          node scripts/board-polish-test.cjs
          node scripts/board-workspace-model-test.cjs
          node scripts/board-workspace-ui-test.cjs
          node scripts/writing-controls-test.cjs
          node scripts/progress-bands-test.cjs

      - name: 打包 arm64 应用
        if: steps.release-plan.outputs.needs-build == 'true'
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          bash package.sh
          node scripts/core-guard.cjs --package "release/GuangyingWriter.app/Contents/Resources/app"
          codesign --verify --deep --strict "release/GuangyingWriter.app"

      - name: 创建 DMG
        if: steps.release-plan.outputs.needs-build == 'true'
        run: |
          mkdir release/dmg-content
          ditto "release/GuangyingWriter.app" "release/dmg-content/光影写手.app"
          ln -s /Applications release/dmg-content/Applications
          hdiutil create \
            -volname "光影写手" \
            -srcfolder "release/dmg-content" \
            -format UDZO \
            "release/GuangyingWriter-macOS-arm64-${RELEASE_TAG}.dmg"

      - name: 发布到 GitHub Releases
        if: steps.release-plan.outputs.needs-build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 仅明确不存在时新建草稿；现有附件不删除、不覆盖、不移动tag。
          node scripts/release-assets.cjs --mode publish --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" --dir release
