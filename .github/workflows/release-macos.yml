name: 发布 macOS 版本

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-14
    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖并检查源码
        run: |
          npm ci
          npm run typecheck
          npm run build
          node scripts/core-guard.cjs
          node scripts/render-test.cjs
          node scripts/writing-test.cjs
          node scripts/zhsp-compat-test.cjs
          node scripts/history-test.cjs
          node scripts/pagination-safety-test.cjs
          node scripts/studio-theme-test.cjs
          node scripts/appearance-test.cjs
          node scripts/outline-reorder-test.cjs
          node scripts/scene-notes-test.cjs
          node scripts/storyboard-drop-test.cjs
          node scripts/storyboard-acts-test.cjs
          node scripts/reports-test.cjs
          node scripts/board-polish-test.cjs
          node scripts/writing-controls-test.cjs
          node scripts/progress-bands-test.cjs

      - name: 打包 arm64 应用
        run: bash package.sh

      - name: 创建 DMG
        run: |
          mkdir release/dmg-content
          ditto "release/GuangyingWriter.app" "release/dmg-content/光影写手.app"
          ln -s /Applications release/dmg-content/Applications
          hdiutil create \
            -volname "光影写手" \
            -srcfolder "release/dmg-content" \
            -format UDZO \
            "release/GuangyingWriter-macOS-arm64-${GITHUB_REF_NAME}.dmg"

      - name: 发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 网页先创建的预发布也能接收 CI 产物；避免因 release 已存在而整条流水线失败。
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "光影写手 $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "release/GuangyingWriter-macOS-arm64.zip" \
            "release/GuangyingWriter-macOS-arm64-${GITHUB_REF_NAME}.dmg" \
            --clobber
