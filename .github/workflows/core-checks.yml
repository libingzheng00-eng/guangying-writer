name: 核心功能回归

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-checks:
    name: core-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 发布卫生与核心契约
        run: |
          node scripts/core-guard.cjs
          node scripts/release-assets-test.cjs
          node scripts/dev-watch-test.cjs
      - name: 类型和构建
        run: |
          npm run typecheck
          npm run build
      - name: 正文交互、兼容与撤销
        run: |
          npm run test:core
